<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1250" viewBox="0 0 2100 1250">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102A43; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #486581; }
      .group { font: 700 18px Arial, sans-serif; fill: #1E5AA8; letter-spacing: 1px; }
      .entity-title { font: 700 21px Arial, sans-serif; fill: #FFFFFF; }
      .field { font: 400 16px Arial, sans-serif; fill: #102A43; }
      .key { font: 700 16px Arial, sans-serif; fill: #102A43; }
      .type { font: 400 14px Arial, sans-serif; fill: #627D98; }
      .rel { fill: none; stroke: #486581; stroke-width: 3; }
      .rel-embedding { fill: none; stroke: #2A9D8F; stroke-width: 3; }
      .rel-rag { fill: none; stroke: #8B5CF6; stroke-width: 3; }
      .rel-secondary { fill: none; stroke: #829AB1; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .card { fill: #FFFFFF; stroke: #BCCCDC; stroke-width: 2; }
      .header-corpus { fill: #1E5AA8; }
      .header-vector { fill: #238A7E; }
      .header-rag { fill: #6D4CCF; }
      .divider { stroke: #D9E2EC; stroke-width: 1.5; }
      .cardinality { font: 700 15px Arial, sans-serif; fill: #334E68; }
      .legend { font: 400 15px Arial, sans-serif; fill: #486581; }
      .source { font: 400 15px Arial, sans-serif; fill: #627D98; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#486581"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2A9D8F"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Fundo sólido para garantir legibilidade no PDF e em temas escuros -->
  <rect x="0" y="0" width="2100" height="1250" fill="#FFFFFF"/>

  <text x="1050" y="52" text-anchor="middle" class="title">Modelo entidade-relacionamento do banco de dados do RAG</text>
  <text x="1050" y="84" text-anchor="middle" class="subtitle">PostgreSQL + pgvector | Anais da SIC/UESC | esquema físico resumido</text>

  <text x="50" y="126" class="group">CORPUS E SEGMENTAÇÃO</text>
  <line x1="50" y1="140" x2="1220" y2="140" stroke="#1E5AA8" stroke-width="3"/>
  <text x="1310" y="126" class="group" fill="#238A7E">REPRESENTAÇÃO VETORIAL</text>
  <line x1="1310" y1="140" x2="2050" y2="140" stroke="#2A9D8F" stroke-width="3"/>
  <text x="50" y="722" class="group" fill="#6D4CCF">RECUPERAÇÃO, AVALIAÇÃO E GERAÇÃO</text>
  <line x1="50" y1="736" x2="2050" y2="736" stroke="#8B5CF6" stroke-width="3"/>

  <!-- documents -->
  <g id="documents">
    <rect x="50" y="165" width="360" height="430" rx="12" class="card"/>
    <path d="M62 165 H398 Q410 165 410 177 V217 H50 V177 Q50 165 62 165" class="header-corpus"/>
    <text x="72" y="201" class="entity-title">documents</text>
    <text x="72" y="248" class="key">PK  sha256</text><text x="292" y="248" class="type">char(64)</text>
    <line x1="70" y1="263" x2="390" y2="263" class="divider"/>
    <text x="72" y="295" class="field">edition</text><text x="292" y="295" class="type">smallint</text>
    <text x="72" y="331" class="field">site_user_id</text><text x="292" y="331" class="type">bigint</text>
    <text x="72" y="367" class="field">participant_name</text><text x="292" y="367" class="type">text</text>
    <text x="72" y="403" class="field">source_path</text><text x="292" y="403" class="type">text</text>
    <text x="72" y="439" class="field">byte_size</text><text x="292" y="439" class="type">bigint</text>
    <text x="72" y="475" class="field">page_count</text><text x="292" y="475" class="type">integer</text>
    <text x="72" y="511" class="field">manifest_status</text><text x="292" y="511" class="type">text</text>
    <text x="72" y="547" class="field">audited_at</text><text x="292" y="547" class="type">timestamptz</text>
  </g>

  <!-- pages -->
  <g id="pages">
    <rect x="470" y="165" width="360" height="500" rx="12" class="card"/>
    <path d="M482 165 H818 Q830 165 830 177 V217 H470 V177 Q470 165 482 165" class="header-corpus"/>
    <text x="492" y="201" class="entity-title">pages</text>
    <text x="492" y="248" class="key">PK/FK document_sha256</text>
    <text x="492" y="284" class="key">PK page_number</text>
    <line x1="490" y1="299" x2="810" y2="299" class="divider"/>
    <text x="492" y="331" class="field">raw_text</text><text x="712" y="331" class="type">text</text>
    <text x="492" y="367" class="field">normalized_text</text><text x="712" y="367" class="type">text</text>
    <text x="492" y="403" class="field">char_count</text><text x="712" y="403" class="type">integer</text>
    <text x="492" y="439" class="field">alpha_ratio</text><text x="712" y="439" class="type">numeric</text>
    <text x="492" y="475" class="field">extraction_status</text><text x="712" y="475" class="type">text</text>
    <text x="492" y="511" class="field">extraction_method</text><text x="712" y="511" class="type">text</text>
    <text x="492" y="547" class="field">text_sha256</text><text x="712" y="547" class="type">char(64)</text>
    <text x="492" y="583" class="field">needs_ocr</text><text x="712" y="583" class="type">boolean</text>
    <text x="492" y="619" class="field">extracted_at</text><text x="712" y="619" class="type">timestamptz</text>
  </g>

  <!-- chunks -->
  <g id="chunks">
    <rect x="890" y="165" width="360" height="500" rx="12" class="card"/>
    <path d="M902 165 H1238 Q1250 165 1250 177 V217 H890 V177 Q890 165 902 165" class="header-corpus"/>
    <text x="912" y="201" class="entity-title">chunks</text>
    <text x="912" y="248" class="key">PK  chunk_id</text><text x="1132" y="248" class="type">char(64)</text>
    <text x="912" y="284" class="key">FK  document_sha256</text>
    <text x="912" y="320" class="key">FK  page_number</text>
    <line x1="910" y1="335" x2="1230" y2="335" class="divider"/>
    <text x="912" y="367" class="field">chunk_index</text><text x="1132" y="367" class="type">integer</text>
    <text x="912" y="403" class="field">chunk_text</text><text x="1132" y="403" class="type">text</text>
    <text x="912" y="439" class="field">char_start / char_end</text><text x="1170" y="439" class="type">integer</text>
    <text x="912" y="475" class="field">lexical_token_count</text><text x="1132" y="475" class="type">integer</text>
    <text x="912" y="511" class="field">overlap_previous_tokens</text><text x="1170" y="511" class="type">integer</text>
    <text x="912" y="547" class="field">section_labels</text><text x="1132" y="547" class="type">jsonb</text>
    <text x="912" y="583" class="field">chunk_text_sha256</text><text x="1132" y="583" class="type">char(64)</text>
    <text x="912" y="619" class="field">segmentation_version</text><text x="1132" y="619" class="type">text</text>
  </g>

  <!-- chunk_embeddings -->
  <g id="chunk_embeddings">
    <rect x="1310" y="165" width="360" height="390" rx="12" class="card"/>
    <path d="M1322 165 H1658 Q1670 165 1670 177 V217 H1310 V177 Q1310 165 1322 165" class="header-vector"/>
    <text x="1332" y="201" class="entity-title">chunk_embeddings</text>
    <text x="1332" y="248" class="key">PK/FK chunk_id</text>
    <text x="1332" y="284" class="key">PK/FK model_key</text>
    <line x1="1330" y1="299" x2="1650" y2="299" class="divider"/>
    <text x="1332" y="331" class="field">embedding</text><text x="1532" y="331" class="type">vector(1024)</text>
    <text x="1332" y="367" class="field">model_token_count</text><text x="1532" y="367" class="type">integer</text>
    <text x="1332" y="403" class="field">truncated</text><text x="1532" y="403" class="type">boolean</text>
    <text x="1332" y="439" class="field">l2_norm</text><text x="1532" y="439" class="type">double</text>
    <text x="1332" y="475" class="field">created_at</text><text x="1532" y="475" class="type">timestamptz</text>
  </g>

  <!-- embedding_models -->
  <g id="embedding_models">
    <rect x="1730" y="165" width="320" height="500" rx="12" class="card"/>
    <path d="M1742 165 H2038 Q2050 165 2050 177 V217 H1730 V177 Q1730 165 1742 165" class="header-vector"/>
    <text x="1752" y="201" class="entity-title">embedding_models</text>
    <text x="1752" y="248" class="key">PK  model_key</text>
    <line x1="1750" y1="263" x2="2030" y2="263" class="divider"/>
    <text x="1752" y="295" class="field">provider</text><text x="1930" y="295" class="type">text</text>
    <text x="1752" y="331" class="field">model_name</text><text x="1930" y="331" class="type">text</text>
    <text x="1752" y="367" class="field">revision</text><text x="1930" y="367" class="type">char(40)</text>
    <text x="1752" y="403" class="field">dimension</text><text x="1930" y="403" class="type">1024</text>
    <text x="1752" y="439" class="field">max_sequence_length</text><text x="1990" y="439" class="type">integer</text>
    <text x="1752" y="475" class="field">pooling</text><text x="1930" y="475" class="type">text</text>
    <text x="1752" y="511" class="field">normalized</text><text x="1930" y="511" class="type">boolean</text>
    <text x="1752" y="547" class="field">library_version</text><text x="1930" y="547" class="type">text</text>
    <text x="1752" y="583" class="field">device</text><text x="1930" y="583" class="type">text</text>
  </g>

  <!-- retrieval_runs -->
  <g id="retrieval_runs">
    <rect x="50" y="760" width="360" height="380" rx="12" class="card"/>
    <path d="M62 760 H398 Q410 760 410 772 V812 H50 V772 Q50 760 62 760" class="header-rag"/>
    <text x="72" y="796" class="entity-title">retrieval_runs</text>
    <text x="72" y="843" class="key">PK  run_id</text><text x="292" y="843" class="type">bigint</text>
    <text x="72" y="879" class="key">FK  model_key</text>
    <line x1="70" y1="894" x2="390" y2="894" class="divider"/>
    <text x="72" y="926" class="field">query_text</text><text x="292" y="926" class="type">text</text>
    <text x="72" y="962" class="field">top_k</text><text x="292" y="962" class="type">smallint</text>
    <text x="72" y="998" class="field">query_embedding</text><text x="260" y="998" class="type">vector(1024)</text>
    <text x="72" y="1034" class="field">embedding_duration_ms</text><text x="300" y="1034" class="type">double</text>
    <text x="72" y="1070" class="field">retrieval_duration_ms</text><text x="300" y="1070" class="type">double</text>
    <text x="72" y="1106" class="field">created_at</text><text x="292" y="1106" class="type">timestamptz</text>
  </g>

  <!-- retrieval_results -->
  <g id="retrieval_results">
    <rect x="470" y="760" width="360" height="300" rx="12" class="card"/>
    <path d="M482 760 H818 Q830 760 830 772 V812 H470 V772 Q470 760 482 760" class="header-rag"/>
    <text x="492" y="796" class="entity-title">retrieval_results</text>
    <text x="492" y="843" class="key">PK/FK run_id</text>
    <text x="492" y="879" class="key">PK rank</text>
    <text x="492" y="915" class="key">FK chunk_id</text>
    <line x1="490" y1="930" x2="810" y2="930" class="divider"/>
    <text x="492" y="962" class="field">cosine_distance</text><text x="712" y="962" class="type">double</text>
  </g>

  <!-- relevance_judgments -->
  <g id="relevance_judgments">
    <rect x="890" y="760" width="360" height="330" rx="12" class="card"/>
    <path d="M902 760 H1238 Q1250 760 1250 772 V812 H890 V772 Q890 760 902 760" class="header-rag"/>
    <text x="912" y="796" class="entity-title">relevance_judgments</text>
    <text x="912" y="843" class="key">PK/FK run_id</text>
    <text x="912" y="879" class="key">PK/FK rank</text>
    <text x="912" y="915" class="key">FK chunk_id</text>
    <line x1="910" y1="930" x2="1230" y2="930" class="divider"/>
    <text x="912" y="962" class="field">label</text><text x="1132" y="962" class="type">text</text>
    <text x="912" y="998" class="field">notes</text><text x="1132" y="998" class="type">text</text>
    <text x="912" y="1034" class="field">judged_at</text><text x="1132" y="1034" class="type">timestamptz</text>
  </g>

  <!-- generated_answers -->
  <g id="generated_answers">
    <rect x="1310" y="760" width="360" height="430" rx="12" class="card"/>
    <path d="M1322 760 H1658 Q1670 760 1670 772 V812 H1310 V772 Q1310 760 1322 760" class="header-rag"/>
    <text x="1332" y="796" class="entity-title">generated_answers</text>
    <text x="1332" y="843" class="key">PK  answer_id</text>
    <text x="1332" y="879" class="key">FK/UK run_id</text>
    <line x1="1330" y1="894" x2="1650" y2="894" class="divider"/>
    <text x="1332" y="926" class="field">generator_model</text><text x="1532" y="926" class="type">text</text>
    <text x="1332" y="962" class="field">model_digest</text><text x="1532" y="962" class="type">text</text>
    <text x="1332" y="998" class="field">prompt_version</text><text x="1532" y="998" class="type">text</text>
    <text x="1332" y="1034" class="field">answer_text</text><text x="1532" y="1034" class="type">text</text>
    <text x="1332" y="1070" class="field">temperature / seed</text><text x="1580" y="1070" class="type">config.</text>
    <text x="1332" y="1106" class="field">num_ctx / num_predict</text><text x="1580" y="1106" class="type">config.</text>
    <text x="1332" y="1142" class="field">response_metadata</text><text x="1532" y="1142" class="type">jsonb</text>
  </g>

  <!-- answer_sources -->
  <g id="answer_sources">
    <rect x="1730" y="760" width="320" height="330" rx="12" class="card"/>
    <path d="M1742 760 H2038 Q2050 760 2050 772 V812 H1730 V772 Q1730 760 1742 760" class="header-rag"/>
    <text x="1752" y="796" class="entity-title">answer_sources</text>
    <text x="1752" y="843" class="key">PK/FK answer_id</text>
    <text x="1752" y="879" class="key">PK source_number</text>
    <text x="1752" y="915" class="key">FK run_id</text>
    <text x="1752" y="951" class="key">FK rank</text>
    <text x="1752" y="987" class="key">FK chunk_id</text>
  </g>

  <!-- Relações principais: linhas desenhadas atrás das anotações -->
  <path d="M410 305 H470" class="rel" marker-end="url(#arrow)"/>
  <text x="423" y="292" class="cardinality">1</text><text x="452" y="292" class="cardinality">N</text>

  <path d="M830 415 H890" class="rel" marker-end="url(#arrow)"/>
  <text x="843" y="402" class="cardinality">1</text><text x="872" y="402" class="cardinality">N</text>

  <path d="M1250 355 H1310" class="rel-embedding" marker-end="url(#arrow-green)"/>
  <text x="1263" y="342" class="cardinality">1</text><text x="1292" y="342" class="cardinality">N</text>

  <path d="M1730 355 H1670" class="rel-embedding" marker-end="url(#arrow-green)"/>
  <text x="1706" y="342" class="cardinality">1</text><text x="1676" y="342" class="cardinality">N</text>

  <path d="M410 900 H470" class="rel-rag" marker-end="url(#arrow-purple)"/>
  <text x="423" y="887" class="cardinality">1</text><text x="452" y="887" class="cardinality">N</text>

  <path d="M830 900 H890" class="rel-rag" marker-end="url(#arrow-purple)"/>
  <text x="843" y="887" class="cardinality">1</text><text x="872" y="887" class="cardinality">0..1</text>

  <path d="M1670 900 H1730" class="rel-rag" marker-end="url(#arrow-purple)"/>
  <text x="1683" y="887" class="cardinality">1</text><text x="1712" y="887" class="cardinality">N</text>

  <!-- FKs cruzadas e vínculos de proveniência -->
  <path d="M1070 665 V705 H650 V760" class="rel-secondary" marker-end="url(#arrow)"/>
  <text x="668" y="750" class="cardinality">N</text>

  <path d="M1070 665 V760" class="rel-secondary" marker-end="url(#arrow)"/>
  <text x="1082" y="748" class="cardinality">N</text>

  <path d="M1890 665 V700 H230 V760" class="rel-embedding" marker-end="url(#arrow-green)"/>
  <text x="244" y="750" class="cardinality">N</text>

  <path d="M410 1120 H1280 V879 H1310" class="rel-secondary" marker-end="url(#arrow)"/>
  <text x="1290" y="867" class="cardinality">0..1</text>

  <path d="M650 760 V744 H1710 V951 H1730" class="rel-secondary" marker-end="url(#arrow)"/>
  <text x="1712" y="938" class="cardinality">N</text>

  <path d="M1250 1070 H1695 V987 H1730" class="rel-secondary" marker-end="url(#arrow)"/>

  <!-- Legenda e fonte -->
  <rect x="50" y="1188" width="1240" height="42" rx="8" fill="#F0F4F8"/>
  <text x="70" y="1215" class="legend"><tspan font-weight="700">PK</tspan> chave primária   |   <tspan font-weight="700">FK</tspan> chave estrangeira   |   <tspan font-weight="700">UK</tspan> restrição de unicidade   |   Linhas tracejadas: vínculos adicionais de rastreabilidade</text>
  <text x="2050" y="1215" text-anchor="end" class="source">Fonte: elaboração própria (2026).</text>
</svg>
